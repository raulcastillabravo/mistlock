name: Run Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect changed Labs
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.detect.outputs.labs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Labs
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LABS=$(python scripts/changed_labs.py --all)
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            LABS=$(git diff --name-only "${{ github.event.before }}" HEAD \
              | python scripts/changed_labs.py)
          else
            BASE=$(git merge-base origin/main HEAD)
            LABS=$(git diff --name-only "$BASE" HEAD \
              | python scripts/changed_labs.py)
          fi
          echo "Changed Labs: $LABS"
          echo "labs=$LABS" >> "$GITHUB_OUTPUT"

  run-tests:
    name: Test ${{ matrix.lab }}
    needs: detect
    if: needs.detect.outputs.labs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJson(needs.detect.outputs.labs) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Project Dependencies
        run: uv sync

      - name: Install Dev Containers CLI
        run: |
          chmod +x ./scripts/setup-tests.sh
          ./scripts/setup-tests.sh

      - name: Run Lab Tests
        run: uv run pytest -v -s "tests/${{ matrix.lab }}"
        env:
          PYTHONPATH: .

  release:
    name: Release
    needs: run-tests
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.run-tests.result != 'failure' &&
      needs.run-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run Semantic Release
        run: npx semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
