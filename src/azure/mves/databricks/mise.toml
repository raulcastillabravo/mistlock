# Python is pinned to 3.11 (not the project-standard 3.12) to match the
# Databricks Runtime 15.4 / PySpark 3.5.0 worker interpreter. A driver on a
# different minor version makes Spark abort with a Python version mismatch.
[tools]
python = "3.11"
uv = "latest"
awscli = "latest"

[settings]
env_file = ".env"

[tasks.sync]
description = "Sync python dependencies"
run = "uv sync"

[tasks.create-bucket]
description = "Create the S3 bucket in RustFS"
run = 'aws s3 mb "s3://$BUCKET_NAME"'

[tasks.setup]
description = "Full environment setup"
run = [
  { task = "sync" },
  { task = "create-bucket" },
]
