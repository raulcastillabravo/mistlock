services:
  localstack:
    image: localstack/localstack:4.14
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,dynamodb,iam,stepfunctions,s3,cloudformation
      - DEFAULT_REGION=${AWS_REGION}
      # Stop Lambda containers after each invocation so none is left behind
      - LAMBDA_KEEPALIVE_MS=0
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12-bookworm
    container_name: dev
    network_mode: host
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - .:/app:cached
    working_dir: /app
    command: sleep infinity

volumes:
  localstack_data:
