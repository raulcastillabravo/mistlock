[tools]
python = "3.12"
uv = "latest"
awscli = "latest"

[settings]
env_file = ".env"

[tasks.sync]
description = "Sync python dependencies"
run = "uv sync"

[tasks.aws-config]
description = "Configure AWS CLI profile for RustFS"
run = """
aws configure set aws_access_key_id $S3_ACCESS_KEY --profile rustfs
aws configure set aws_secret_access_key $S3_SECRET_KEY --profile rustfs
aws configure set region $AWS_DEFAULT_REGION --profile rustfs
aws configure set endpoint_url $S3_ENDPOINT --profile rustfs
"""

[tasks.create-buckets]
description = "Create bronze and silver buckets using AWS CLI"
run = """
aws s3 mb s3://$S3_BUCKET_BRONZE --profile rustfs 2>/dev/null || true
aws s3 mb s3://$S3_BUCKET_SILVER --profile rustfs 2>/dev/null || true
"""

[tasks.setup]
description = "Full environment setup"
run = [
  { task = "sync" },
  { task = "aws-config" },
  { task = "create-buckets" },
]
